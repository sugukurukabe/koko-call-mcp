name: Code Security (Semgrep CE)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep-ce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install only the hash-pinned CE engine distribution
        run: 'python -m pip install --no-deps --require-hashes --only-binary=:all: -r security/semgrep/requirements.txt'
      - name: Locate the local engine
        run: |
          CORE_PATH=$(python -c "from importlib.metadata import distribution; print(distribution('semgrep').locate_file('semgrep/bin/semgrep-core'))")
          echo "SEMGREP_CORE_PATH=$CORE_PATH" >> "$GITHUB_ENV"
      - name: Verify dependency gate failures and SSRF rule controls
        run: npm run security:verify
      - name: Scan source with local fixed rules and reviewed nonissues
        run: npm run security:code
      - name: Verify code-security evidence contains no secrets
        id: safe-evidence
        if: always()
        run: node scripts/ci-verify-no-secrets.mjs evidence --require=security/code-security.json --require=security/code-canary.json --require=security/dependency-probes.json
      - name: Upload reviewed code-security evidence
        if: always() && steps.safe-evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: code-security-${{ github.sha }}
          path: evidence/security/*.json
          if-no-files-found: error
          retention-days: 7
