<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>MCP Apps mock host — Investor Radar</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #frame { display: block; border: 0; width: 100%; height: 100vh; }
  body.dark { background: #191919; }
</style>
</head>
<body>
<iframe
  id="frame"
  src="./investor-radar.html"
  title="Investor Radar"
  sandbox="allow-scripts allow-same-origin allow-downloads"
  allow="clipboard-write"
></iframe>
<script>
const PROTOCOL_VERSION = "2026-01-26";
const params = new URLSearchParams(location.search);
const theme = params.get("theme") === "dark" ? "dark" : "light";
const displayMode = params.get("displayMode") ?? "inline";
const denyMessage = params.get("denyMessage") === "1";
const autoResult = params.get("autoResult") !== "0";
if (theme === "dark") document.body.classList.add("dark");
const frame = document.getElementById("frame");
const send = (message) => frame.contentWindow.postMessage(message, "*");
const ACCESSED_AT = "2026-07-26T09:00:00.000Z";
const attribution = {
  dataSource: "中小企業庁 官公需情報ポータルサイト",
  apiEndpoint: "http://www.kkj.go.jp/api/",
  licenseUrl: "https://www.kkj.go.jp/s/help/notes/",
  serviceDisclaimer: "JP Bids MCP returns public procurement search results as reference information.",
  accessedAt: ACCESSED_AT,
};
const mappingResult = {
  searchHits: 1,
  returnedCount: 1,
  mappedCount: 1,
  unmappedCount: 0,
  mapped: [
    {
      bid: {
        resultId: 1,
        key: "KKJ-2026-46201-0311",
        projectName: "富士通株式会社 学校教育情報システム 保守運用業務",
        organizationName: "鹿児島市",
        prefectureName: "鹿児島県",
        category: "役務",
        cftIssueDate: "2026-07-21",
        externalDocumentUri: "https://www.kkj.go.jp/doc/ja/661120260721.pdf",
      },
      matches: [
        {
          company: { code: "6702", name: "富士通", aliases: [], sector: "電気機器" },
          confidence: "contains",
          matchedText: "富士通",
        },
      ],
    },
  ],
  companies: [
    {
      company: { code: "6702", name: "富士通", aliases: [], sector: "電気機器" },
      noticeCount: 1,
      latestNoticeDate: "2026-07-21",
      latestNoticeKey: "KKJ-2026-46201-0311",
      prefectureBreakdown: { 鹿児島県: 1 },
      categoryBreakdown: { 役務: 1 },
      noticeKeys: ["KKJ-2026-46201-0311"],
    },
  ],
  catalogSource: "bundled",
  caveats: ["KKJ検索結果は入札公告であり、公式の落札者・落札金額を含まない。"],
  investmentDisclaimer:
    "本情報は投資助言ではありません。売買の推奨は行いません。投資判断は自己責任で、公式の調達書類・開示・市場データをご自身で確認してください。 / This is not investment advice and is not a buy or sell recommendation. / Informasi ini bukan nasihat investasi dan bukan rekomendasi beli atau jual.",
  attribution,
};
const hostCapabilities = {
  openLinks: {},
  serverTools: { listChanged: false },
  ...(denyMessage ? {} : { message: { text: {} } }),
};
const hostContext = {
  theme,
  displayMode,
  availableDisplayModes: ["inline", "fullscreen"],
  locale: "ja-JP",
};
const result = (id, value) => send({ jsonrpc: "2.0", id, result: value });
window.addEventListener("message", (event) => {
  const message = event.data;
  if (!message || message.jsonrpc !== "2.0") return;
  switch (message.method) {
    case "ui/initialize":
      result(message.id, {
        protocolVersion: PROTOCOL_VERSION,
        hostInfo: { name: "mcp-apps-harness", version: "1.0.0" },
        hostCapabilities,
        hostContext,
      });
      return;
    case "ui/notifications/initialized":
      if (autoResult) {
        send({
          jsonrpc: "2.0",
          method: "ui/notifications/tool-result",
          params: {
            structuredContent: mappingResult,
            content: [{ type: "text", text: "名寄せ 1件" }],
          },
        });
      }
      return;
    case "ui/open-link":
    case "ui/message":
    case "ui/request-display-mode":
    case "tools/call":
      result(message.id, message.method === "tools/call"
        ? { content: [{ type: "text", text: "ok" }], structuredContent: mappingResult }
        : {});
      return;
    default:
      if (message.id !== undefined) result(message.id, {});
  }
});
</script>
</body>
</html>
