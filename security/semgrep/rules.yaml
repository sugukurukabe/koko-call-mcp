    source-rule-url: 
      https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-non-literal-regexp.js
    category: security
    technology:
    - javascript
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: LOW
    vendored-source-path: javascript/lang/security/audit/detect-non-literal-regexp.yaml
    vendored-source-id: detect-non-literal-regexp
