rules:
- id: vendor.javascript.ajv.security.audit.ajv-allerrors-true.ajv-allerrors-true
  message: 'By setting `allErrors: true` in `Ajv` library, all error objects will be allocated without limit. This
    allows the attacker to produce a huge number of errors which can lead to denial of service. Do not use `allErrors:
    true` in production.'
  metadata:
    cwe:
    - 'CWE-400: Uncontrolled Resource Consumption'
    category: security
    technology:
    - ajv
    references:
    - https://ajv.js.org/options.html#allerrors
    cwe2022-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
    vendored-source-path: javascript/ajv/security/audit/ajv-allerrors-true.yaml
    vendored-source-id: ajv-allerrors-true
  languages:
  - javascript
  - typescript
  severity: WARNING
  pattern-either:
  - pattern: "new Ajv({...,allErrors: true,...},...)\n"
  - patterns:
    - pattern: "new Ajv($SETTINGS,...)\n"
    - pattern-inside: "$SETTINGS = {...,allErrors: true,...}\n...\n"
- id: vendor.javascript.angular.security.detect-angular-element-methods.detect-angular-element-methods
  message: Use of angular.element can lead to XSS if user-input is treated as part of the HTML element within 
    `$SINK`. It is recommended to contextually output encode user-input, before inserting into `$SINK`. If the
    HTML needs to be preserved it is recommended to sanitize the input using $sce.getTrustedHTML or $sanitize.
  metadata:
    confidence: LOW
    references:
    - https://docs.angularjs.org/api/ng/function/angular.element
    - https://owasp.org/www-chapter-london/assets/slides/OWASPLondon20170727_AngularJS.pdf
    category: security
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    technology:
    - angularjs
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    vendored-source-path: javascript/angular/security/detect-angular-element-methods.yaml
    vendored-source-id: detect-angular-element-methods
  languages:
  - javascript
  - typescript
  severity: INFO
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-inside: "function(..., $SCOPE, ...) { ... }\n"
        - focus-metavariable: $SCOPE
        - metavariable-regex:
            metavariable: $SCOPE
            regex: ^\$scope$
      - pattern: $rootScope
      - pattern: $injector.get('$rootScope')
      - pattern: $injector.get('$scope')
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern-inside: "angular.element(...). ... .$SINK($QUERY)\n"
      - pattern-inside: "$ANGULAR = angular.element(...)\n...\n$ANGULAR. ... .$SINK($QUERY)\n"
    - metavariable-regex:
        metavariable: $SINK
        regex: ^(after|append|html|prepend|replaceWith|wrap)$
    - focus-metavariable: $QUERY
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: $sce.getTrustedHtml(...)
      - pattern: $sanitize(...)
      - pattern: DOMPurify.sanitize(...)
- id: vendor.javascript.angular.security.detect-angular-element-taint.detect-angular-element-taint
  message: Use of angular.element can lead to XSS if user-input is treated as part of the HTML element within 
    `$SINK`. It is recommended to contextually output encode user-input, before inserting into `$SINK`. If the
