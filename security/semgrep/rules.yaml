- id: vendor.javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
  message: RegExp() called with a `$ARG` function argument, this might allow an attacker to cause a Regular 
    Expression Denial-of-Service (ReDoS) within your application as RegExP blocks the main thread. For this 
    reason, it is recommended to use hardcoded regexes instead. If your regex is run on user-controlled input,
    consider performing input validation or use a regex checking/sanitization library such as 
    https://www.npmjs.com/package/recheck to verify that the regex does not appear vulnerable to ReDoS.
  metadata:
    owasp:
    - A05:2021 - Security Misconfiguration
    - A06:2017 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    cwe:
    - 'CWE-1333: Inefficient Regular Expression Complexity'
